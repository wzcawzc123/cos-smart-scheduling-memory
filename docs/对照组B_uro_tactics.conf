# 对照组 B：NovaSched Zen Edition 映射值（SM8550 / 一加11）
# 来源与推导：docs/对照组B_NovaSched参考_v1.md（原作者 ZenJooo / GPL-3.0，仅参考其公开文档）
# 用法：拷到 /sdcard/Android/UnifiedRootOptimizer/uro_tactics.conf（热生效）
# 前提：v0.35+（per-cluster clamp）；上机前自检 sh runtime/tools/check_tactics.sh <本文件>
#
# 映射方法：NovaSched 的每簇百分比 → 本机频点表 → 向下吸附到最近真实频点
#   省电 65/52/56%   均衡 80/68/69%   性能 85/84/82%   极速 95/100/100%
#   （小核% → policy0；中核% → policy3；超大核% → policy7）

[POWER_SAVE]
cpuClamp=1
maxFreqK=1228800
maxFreqK3=1401600
maxFreqK7=1708800

[BALANCE]
cpuClamp=1
maxFreqK=1555200
maxFreqK3=1785600
maxFreqK7=2092800

[PERFORMANCE]
cpuClamp=1
maxFreqK=1670400
maxFreqK3=2323200
maxFreqK7=2592000

[FAST]
cpuClamp=1
maxFreqK=1900800
maxFreqK3=2707200
maxFreqK7=2956800
