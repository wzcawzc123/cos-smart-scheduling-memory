<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UnifiedRootOptimizer 看板</title>
<style>
/* 奶油粉系 (Nexus风) — 纯浅色，与 COSMemory 面板 style.css 同源色板 */
:root{
  --bg:#FBF2EE; --card:#F7E4DE; --card2:#F3D9D1;
  --ink:#4A2B2B; --ink2:#8A6B66; --ink3:#B39A95;
  --pill:#F3D9D1; --pill-line:#E8C4BA;
  --green:#5B9A6E; --green-bg:#DFEFE4;
  --red:#C4614F;   --red-bg:#F8DFDA;
  --amber:#B8873F; --amber-bg:#F6E8D2;
  --sep:#E8CFC7;
  --radius:28px; --radius-s:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  max-width:560px; margin:0 auto; padding-bottom:32px;
}
.hd{padding:26px 22px 8px;}
.hd h1{margin:0; font-size:32px; font-weight:800; letter-spacing:-.5px;}
.hd .sub{color:var(--ink2); font-size:13.5px; margin-top:3px;}
.card{background:var(--card); border-radius:var(--radius); padding:6px 16px; margin:10px 16px 0;}
.hero{background:var(--card); border-radius:var(--radius); padding:16px; margin:10px 16px 0;}
.hero-top{display:flex; gap:14px; align-items:center;}
.dot{width:44px; height:44px; border-radius:50%; background:var(--card2);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 3px rgba(74,43,43,.08); flex:0 0 auto;}
.dot.on::after{content:''; width:12px; height:12px; border-radius:50%; background:var(--green);
  box-shadow:0 0 0 4px var(--green-bg);}
.dot.warn::after{content:''; width:12px; height:12px; border-radius:50%; background:var(--amber);
  box-shadow:0 0 0 4px var(--amber-bg);}
.hero-tt{flex:1; min-width:0;}
.hero-tt .t{font-size:26px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
.hero-tt .t.ps{color:var(--amber);} .hero-tt .t.bl{color:var(--green);}
.hero-tt .t.pf{color:var(--ink);}   .hero-tt .t.gs{color:var(--red);}
.hero-tt .s{font-size:13.5px; color:var(--ink2); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 0; border-bottom:.5px solid var(--sep);}
.row:last-child{border-bottom:none;}
.row .name{display:block; font-size:15.5px; word-break:break-all;}
.row .meta{display:block; color:var(--ink2); font-size:12.5px; margin-top:2px;}
.row .val{color:var(--ink2); font-size:13px; font-variant-numeric:tabular-nums;
  text-align:right; word-break:break-all;}
/* 与面板同款开关（st-switch）：64×32 药丸 + 24 圆点滑动 */
.st-switch{position:relative; min-width:64px; height:32px; border-radius:100px; border:none;
  background:var(--pill-line); cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:6px; flex:0 0 auto; padding:0;}
.st-switch i{position:absolute; left:4px; top:4px; width:24px; height:24px; border-radius:50%;
  background:var(--ink3); transition:transform .18s;}
.st-switch.on{background:var(--green-bg);}
.st-switch.on i{transform:translateX(32px); background:var(--green);}
.st-switch.arming{background:var(--amber-bg);}
.st-switch.arming i{background:var(--amber);}
.pill{display:inline-block; padding:2px 10px; border-radius:100px; font-size:12.5px; font-weight:600;
  background:var(--pill); color:var(--ink2); border:1px solid var(--pill-line);}
.pill.ok{background:var(--green-bg); color:var(--green); border-color:transparent;}
.pill.warn{background:var(--amber-bg); color:var(--amber); border-color:transparent;}
.pill.bad{background:var(--red-bg); color:var(--red); border-color:transparent;}
.sec{font-size:13px; color:var(--ink3); font-weight:700; letter-spacing:.6px;
  text-transform:uppercase; margin:22px 24px 0;}
.tl{list-style:none; margin:0;}
.tl li{display:flex; gap:10px; align-items:baseline; padding:11px 0;
  border-bottom:.5px solid var(--sep);}
.tl li:last-child{border-bottom:none;}
.tl time{color:var(--ink3); font-size:12.5px; font-variant-numeric:tabular-nums; flex:0 0 auto;}
.tl b{font-size:14px; font-weight:700; flex:0 0 130px; letter-spacing:-.2px;}
.tl b.ps{color:var(--amber);} .tl b.bl{color:var(--green);} .tl b.gs{color:var(--red);}
.tl span{color:var(--ink2); font-size:13px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.foot{color:var(--ink3); font-size:12px; margin:18px 24px 0; line-height:1.6;}
.foot.err{color:var(--red);}
</style>
</head>
<body>

<div class="hd">
  <h1>UnifiedRootOptimizer</h1>
  <div class="sub" id="ver">…</div>
</div>

<div class="hero">
  <div class="hero-top">
    <span class="dot" id="hdot"></span>
    <span class="hero-tt">
      <span class="t" id="lvl">…</span>
      <span class="s" id="why">读取中…</span>
    </span>
  </div>
</div>

<div class="card">
  <div class="row">
    <span><span class="name">接管总闸</span><span class="meta">enforce · 面板开关同源</span></span>
    <span style="display:flex; gap:10px; align-items:center;">
      <span class="pill" id="ent">…</span>
      <button class="st-switch" id="sw"><i></i></button>
    </span>
  </div>
  <div class="row">
    <span class="name">基线状态</span>
    <span class="val" id="base">…</span>
  </div>
  <div class="row">
    <span class="name">看门狗</span>
    <span class="val" id="wd">…</span>
  </div>
</div>

<div class="sec">档位时间线</div>
<div class="card"><ul class="tl" id="tl"><li>读取中…</li></ul></div>

<div class="sec">写入证据</div>
<div class="card" id="ev">…</div>

<p class="foot">数据源：telemetry.jsonl · bridge.state · cpu.state · memory.json · uag sysfs · 每 5 秒刷新</p>
<p class="foot err" id="err" style="display:none"></p>

<script>
// ===== 桥（复用 COSMemory 面板 composables/ksu.ts 实现要点）=====
function detectBridge(){
  const w=globalThis;
  for(const o of [w.ksu,w.WebUIX,w.mmrl]) if(o&&typeof o.exec==='function') return {exec:async c=>String(await o.exec(c)??'')};
  if(w.ksu&&typeof w.ksu.execAsync==='function') return {exec:c=>new Promise((res,rej)=>{try{w.ksu.execAsync(c,r=>res(r??''))}catch(e){rej(e)}})};
  return null;
}
function b64d(s){s=s.replace(/\s+/g,'');if(!s)return'';const bin=atob(s);return new TextDecoder('utf-8').decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0)))}
async function readCmd(br,cmd){
  // 成组再管道（避免 || 短路明文直出）；base64 保多行安全
  const out=await br.exec('('+cmd+') | base64 | tr -d "\\n"');
  if(!out.trim())return'';
  try{return b64d(out)}catch{return''}
}
function splitSeg(d){const p=d.split(/@@SEG:([A-Za-z0-9_-]+)@@/g),o={};for(let i=1;i<p.length;i+=2)o[p[i]]=(p[i+1]??'').trim();return o}
const G=k=>(typeof k==='string'?k:'');   // 段缺失防御（undefined 不炸）

const L='/sdcard/Android/UnifiedRootOptimizer';
// 数组 join(';')：每段不带尾分号，避免拼出 ';;'（sh 语法错误 → 整条命令失败）
const batch=[
  'echo @@SEG:prop@@;cat /data/adb/modules/uro/module.prop 2>/dev/null',
  'echo @@SEG:conf@@;cat '+L+'/uro.conf 2>/dev/null',
  'echo @@SEG:tel@@;tail -14 '+L+'/log/telemetry.jsonl 2>/dev/null',
  'echo @@SEG:bridge@@;cat '+L+'/log/bridge.state 2>/dev/null',
  'echo @@SEG:cpu@@;cat '+L+'/log/cpu.state 2>/dev/null',
  'echo @@SEG:wd@@;tail -3 '+L+'/log/watchdog.log 2>/dev/null',
  'echo @@SEG:json@@;grep -oE "\\"(aggressive|depth|cooldownSec)\\": [^,}]*" /data/adb/modules/COSMemory/config/memory.json 2>/dev/null',
  'echo @@SEG:uag@@;for p in 0 3 7;do echo -n p$p=;cat /sys/devices/system/cpu/cpufreq/policy$p/uag/up_rate_limit_us 2>/dev/null;echo;done'
].join(';');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LVL={POWER_SAVE:'ps',BALANCE:'bl',PERFORMANCE:'pf',FAST:'pf',GAME:'gs',MEMORY_PRESSURE:'ps',BOOT:'bl'};

let br=null, armed=false;
function fail(m){const e=document.getElementById('err');e.style.display='block';e.textContent=m}

async function refresh(){
  if(!br){fail('未检测到 WebUI 桥（ksu/WebUIX/mmrl）');return}
  try{
    const seg=splitSeg(await readCmd(br,batch));
    const sp=G(seg.prop), sc=G(seg.conf), st_=G(seg.tel), sb=G(seg.bridge), scpu=G(seg.cpu);
    document.getElementById('ver').textContent=((sp.match(/version=(.*)/)||[])[1]||'')+' · '+
      ((sp.match(/description=(.*)/)||[])[1]||'');
    // 当前档 = 最后一条 telemetry
    const rows=(st_||'').split('\n').filter(l=>l.trim().startsWith('{')).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
    const cur=rows[rows.length-1];
    if(cur){
      const lv=document.getElementById('lvl');
      lv.textContent=cur.scenario;
      lv.className='t '+(LVL[cur.scenario]||'bl');
      document.getElementById('why').textContent=(cur.why||'')+(cur.handover?' · 撤权中':'');
    }
    // enforce 总闸
    const en=(sc.match(/BRIDGE_ENFORCE=(\d)/)||[])[1]==='1';
    armed=en;
    document.getElementById('ent').textContent=en?'ON':'OFF';
    document.getElementById('ent').className='pill '+(en?'ok':'');
    document.getElementById('sw').className='st-switch'+(en?' on':'');
    // 基线 / 看门狗 → 顶部状态点
    const bd=(sb.match(/DIRTY=(\w+)/)||[])[1]||'?';
    const cd=(scpu.match(/DIRTY=(\w+)/)||[])[1]||'?';
    const clean=(bd==='false'&&cd==='false');
    document.getElementById('base').innerHTML=clean?'<span class="pill ok">CLEAN</span>':
      '<span class="pill warn">DIRTY（内存:'+esc(bd)+' / CPU:'+esc(cd)+'）</span>';
    const wlines=G(seg.wd).split('\n').filter(Boolean);
    const last=wlines[wlines.length-1]||'';
    const wdOk=!last.includes('halt');
    document.getElementById('wd').innerHTML=wdOk?'<span class="pill ok">正常</span>':'<span class="pill bad">HALT</span>';
    document.getElementById('hdot').className='dot '+(clean&&wdOk?'on':'warn');
    // 时间线
    document.getElementById('tl').innerHTML=rows.slice(-8).reverse().map(r=>{
      const t=new Date(r.ts*1000);
      const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
      return '<li><time>'+hh+'</time><b class="'+(LVL[r.scenario]||'bl')+'">'+esc(r.scenario)+'</b><span title="'+esc(r.why)+'">'+esc(r.why||'')+'</span></li>';
    }).join('')||'<li>暂无记录</li>';
    // 写入证据
    const j=G(seg.json).replace(/"/g,'').replace(/:\s*/g,' = ');
    const u=G(seg.uag).replace(/\s+/g,' · ').trim();
    document.getElementById('ev').innerHTML=
      '<div class="row"><span class="name">memory.json</span><span class="val">'+esc(j||'-')+'</span></div>'+
      '<div class="row"><span class="name">uag up_rate</span><span class="val">'+esc(u||'-')+'</span></div>'+
      '<div class="row"><span class="name">最新 action_id</span><span class="val">'+esc(cur?cur.action_id:'-')+'</span></div>';
  }catch(e){fail('读取失败: '+e)}
}

// 总闸：开启需二次确认（与 COSMemory 面板交互一致），关闭直接执行
let confirmT=null;
document.getElementById('sw').addEventListener('click',async()=>{
  if(!br){fail('未检测到 WebUI 桥');return}
  const swEl=document.getElementById('sw');
  if(armed){ // 关闭
    await br.exec('echo BRIDGE_ENFORCE=0 > '+L+'/uro.conf');
    setTimeout(refresh,300); return;
  }
  if(!confirmT){ // 开启：进入确认态
    swEl.classList.add('arming');
    document.getElementById('ent').textContent='再点一次确认';
    document.getElementById('ent').className='pill warn';
    confirmT=setTimeout(()=>{confirmT=null;refresh()},2500); return;
  }
  clearTimeout(confirmT); confirmT=null;
  await br.exec('echo BRIDGE_ENFORCE=1 > '+L+'/uro.conf');
  setTimeout(refresh,300);
});

br=detectBridge();
refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
