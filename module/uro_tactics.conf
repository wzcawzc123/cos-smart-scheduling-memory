# URO 场景配方 v1（v0.33 起）—— 改完保存即生效（mtime 热重载，无需重启进程）
#
# 用法：取消注释并改值即可生效。
# 铁律：整份文件任一行写错 → 整份被拒绝（events.log 记 TacticsConf REJECT ...），
#       运行态保持上一次成功值（不会半生不熟地生效）。
# 上机前自检：sh runtime/tools/check_tactics.sh <本文件>   （退出码 0 = 合法）
#
# 语法：# 或 // 为注释行；[场景] 段头；key=value；空行忽略
# 场景：BOOT / BALANCE / POWER_SAVE / PERFORMANCE / FAST / GAME / MEMORY_PRESSURE
# 未写 = 沿用内置默认（即 v0.32.0 行为，零回归）

# ── 字段全表（值域即校验规则；-1 一律 = 不干预/回基线）────────────────────
#  内存： reclaim(0/1) freeze(0/1) maxKill(0..20) depth(空/cached/service) cooldown(-1..3600)
#   CPU： uagUp(-1..1e6) uagDown(-1..1e6) uagHi(-1..100) uagTl(-1..100)
#         cpuMinK(-1 或 ≥300000) cpuClamp(0/1) maxFreqK(-1 或 ≥300000) uagSoftK(-1 或 ≥300000)
#   线程/分组（v0.40）：threadPin(0/1) threadPinMask(-1..255) bgCpus(-1..255) topCpus(-1..255)
#         位掩码写法：bit i = cpu i。0x07=0-2(小核) 0xF8=3-7(中大核) 0xFF=0-7；-1=不干预
#         threadPin=1 把前台 App 的主线程/RenderThread 绑到 threadPinMask（默认 3-7），
#         关掉即自动解绑；bgCpus 限制 background/system-background 组，topCpus 限制 top-app 组
#   GPU： gpuIdle(0..1000) gpuMinPwr(-1..20) gpuMaxPwr(-1..20) gpuSplit(-1..1)
#         gpuDefPwr(-1..20) gpuMinBw(-1..10000) gpuForceClk(-1..1) gpuForceBus(-1..1)
#   保活： keepAdj(-1..1000)      让权： handover(0/1)
#
# ── 语义提示 ────────────────────────────────────────────────────────────
#  · kgsl pwrlevel：0=最高频，8=最低频（本机 9 档）→ 抬保底用"小值"，压上限用"大值"
#  · uagSoftK = OPLUS 预留的软上限口（比硬写 maxFreqK 温和；maxFreqK 会被系统 ~6s 节奏回写）
#  · cpuMinK 抬的是"下限"（性能向，让轻载也上高频）；maxFreqK 压的是"上限"（省电向）
#  · gpuForceClk/Bus = 强制 GPU 时钟/总线常开 → 稳定换耗电，只建议游戏档短时使用

# ────────────────────────── 省电档 ──────────────────────────
# 夹 CPU 上限：2026-10-11 实探证实"夹边界"是唯一可量化的手段
#（C 档案：大核 2.09G / 中核 1.92G / 小核 1.46G → 大核均值 -17%、中核 -9%，两轮一致）
[POWER_SAVE]
# cpuClamp=1
# maxFreqK=1900800
# uagSoftK=1800000
# gpuMaxPwr=4

# ────────────────────────── 性能档 ──────────────────────────
# 抬 CPU 下限（轻载也上高频）+ GPU 保底（不让它掉最低档）
[PERFORMANCE]
# cpuMinK=1200000
# gpuMinPwr=5
# gpuDefPwr=5
# gpuMinBw=50

# ────────────────────────── 极速档 ──────────────────────────
[FAST]
# cpuMinK=1200000
# gpuMinPwr=5

# ────────────────────────── 游戏档 ──────────────────────────
# 慎改：GAME = 全量让权（§5.5），CPU/GPU 零写入、内存暂停 reclaim。
# 在此段写值等于削弱让权语义，除排障外不建议使用。
# 若确认要"游戏时保帧"，可单独试 force 系（注意耗电与发热）：
# [GAME]
# gpuMinPwr=4
# gpuForceClk=1

# ────────────────────────── 内存压力档 ──────────────────────────
# [MEMORY_PRESSURE]
# maxKill=5
# depth=service
