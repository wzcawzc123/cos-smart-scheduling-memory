# URO 场景配方 v1（v0.33 起）—— 改完保存即生效（mtime 热重载，无需重启进程）
#
# 用法：取消注释并改值即可生效。
# 铁律：整份文件任一行写错 → 整份被拒绝，并记 events.log（TacticsConf REJECT ...），
#       运行态保持上一次成功值（不会半生不熟地生效）。
# 语法：# 或 // 为注释行；[场景] 段头；key=value；空行忽略
# 场景：BOOT / BALANCE / POWER_SAVE / PERFORMANCE / FAST / GAME / MEMORY_PRESSURE
# 未写 = 沿用内置默认（即 v0.32.0 行为，零回归）
# 字段与值域：见 docs/参数外置_v0.33_spec.md §3

# ────────────────────────── 省电档 ──────────────────────────
# CPU 夹频：2026-10-11 实探证实"夹边界"是唯一可量化的手段
#（C 档案：大核 2.09G / 中核 1.92G / 小核 1.46G → 大核均值 -17%、中核 -9%，两轮一致）
# 注意：本机 scaling_max_freq 有 Oplus 侧动态钳制（~6s 节奏），夹频可能被系统回写；
#       回读不一致会在 policy 日志记 mismatch（已知常态，非故障）。
[POWER_SAVE]
# cpuClamp=1
# maxFreqK=1900800

# ────────────────────────── 性能档 ──────────────────────────
# GPU 保底：kgsl pwrlevel 语义 0=最高频、8=最低频（本机 9 档）
# 现状 default_pwrlevel=7 / min_pwrlevel=7 / max_pwrlevel=0（几乎全放开）
# 游戏/性能档把 min_pwrlevel 抬到 5~4 = 不让 GPU 掉到最低档（待阶段C实验实测后启用）
[PERFORMANCE]
# gpuMinPwr=5
# gpuMaxPwr=-1

# ────────────────────────── 极速档 ──────────────────────────
[FAST]
# gpuMinPwr=5

# ────────────────────────── 游戏档 ──────────────────────────
# 慎改：GAME = 全量让权（§5.5），CPU/GPU 零写入、内存暂停 reclaim。
# 在此段写值等于削弱让权语义，除排障外不建议使用。
# [GAME]
# uagHi=-1

# ────────────────────────── 内存压力档 ──────────────────────────
# [MEMORY_PRESSURE]
# maxKill=5
# depth=service
